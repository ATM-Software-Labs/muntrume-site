name = "muntrume-ai"
main = "index.ts"
compatibility_date = "2026-11-20"

# Despliegue: npx wrangler deploy --config workers/ai/ai.wrangler.toml
# El sitio responde sin este worker: /api/ai cae al motor local.

[ai]
binding = "AI"

# KV opcional para el límite compartido entre aislados.
