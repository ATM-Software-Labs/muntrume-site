name: MMT Sync release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.9.3
        with:
          workspaces: desktop

      - name: Frontend
        working-directory: desktop
        run: npm ci

      - name: Signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Falta TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          node -e "const c=require('./desktop/src-tauri/tauri.conf.json'); const k=c.plugins.updater.pubkey||''; if(!k || k.includes('REPLACE_WITH')) { console.error('Pega la clave pública en plugins.updater.pubkey'); process.exit(1); }"

      - name: Tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            ver=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
            echo "name=desktop-v${ver}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: MMT Sync ${{ steps.tag.outputs.name }}
          releaseBody: |
            Instalador de MMT Sync para Windows 10 y 11.
            El ejecutable no lleva certificado de código: SmartScreen puede mostrar «editor desconocido».
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi --config src-tauri/tauri.release.json

      - name: Check SignPath configuration
        id: signpath_check
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) -and -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Stage unsigned Windows installers
        if: steps.signpath_check.outputs.enabled == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signpath-unsigned | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe signpath-unsigned/ -ErrorAction SilentlyContinue
          Copy-Item desktop/src-tauri/target/release/bundle/msi/*.msi signpath-unsigned/ -ErrorAction SilentlyContinue
          Get-ChildItem signpath-unsigned

      - name: Upload unsigned installers artifact
        if: steps.signpath_check.outputs.enabled == 'true'
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: mmt-sync-unsigned
          path: signpath-unsigned/*
          retention-days: 1

      - name: Sign installers with SignPath Foundation
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mmt-sync' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 2400
          output-artifact-directory: ./signpath-signed

      # Authenticode cambia los bytes del instalador: hay que volver a generar las firmas
      # del updater de Tauri (.sig) y actualizar latest.json, o las auto-actualizaciones fallarían.
      - name: Re-sign updater signatures and publish signed installers
        if: steps.signpath_check.outputs.enabled == 'true'
        shell: pwsh
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem -Path ../signpath-signed -Include *.exe,*.msi -Recurse)
          if ($files.Count -eq 0) { throw "SignPath no devolvió instaladores firmados." }
          # GitHub publica los assets con puntos en lugar de espacios: mismo nombre para que --clobber los reemplace.
          $files = @($files | ForEach-Object { $n = $_.Name -replace ' ', '.'; if ($n -ne $_.Name) { Rename-Item $_.FullName $n }; Get-Item (Join-Path $_.DirectoryName $n) })
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne "Valid") { throw "Firma Authenticode no válida en $($f.Name): $($sig.Status)" }
            npx tauri signer sign "$($f.FullName)"
            if ($LASTEXITCODE -ne 0) { throw "tauri signer sign falló en $($f.Name)" }
          }
          gh release download $env:TAG -p latest.json -O ../latest.json --clobber
          node -e "const fs=require('fs');const path=require('path');const dir='../signpath-signed';const all=[];(function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);e.isDirectory()?walk(p):all.push(p);}})(dir);const j=JSON.parse(fs.readFileSync('../latest.json','utf8'));const norm=s=>s.replace(/ /g,'.');for(const k of Object.keys(j.platforms||{})){const url=j.platforms[k].url||'';const name=decodeURIComponent(url.split('/').pop());const hit=all.find(p=>p.endsWith('.sig')&&norm(path.basename(p,'.sig'))===name);if(hit){j.platforms[k].signature=fs.readFileSync(hit,'utf8').trim();console.log('updated',k);}else{console.log('no match',k,name);}}j.notes='Instalador de MMT Sync para Windows 10 y 11. Firmado digitalmente mediante SignPath Foundation.';fs.writeFileSync('../latest.json',JSON.stringify(j,null,2));"
          $upload = @($files | ForEach-Object { $_.FullName; "$($_.FullName).sig" }) + (Resolve-Path ../latest.json).Path
          gh release upload $env:TAG @upload --clobber
          gh release edit $env:TAG --notes "Instalador de MMT Sync para Windows 10 y 11.`nFirmado digitalmente: Free code signing provided by SignPath.io, certificate by SignPath Foundation."
