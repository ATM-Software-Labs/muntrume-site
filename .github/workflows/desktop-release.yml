name: MMT Sync release

on:
  push:
    tags:
      - "desktop-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version number to sync (e.g. 0.3.8)"
        required: false
        type: string
      tag:
        description: "Optional tag name (e.g. desktop-v0.3.8)"
        required: false
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2.9.3
        with:
          workspaces: desktop

      - name: Frontend
        working-directory: desktop
        run: npm ci

      - name: Signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Falta TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          fi
          node -e "const c=require('./desktop/src-tauri/tauri.conf.json'); const k=c.plugins.updater.pubkey||''; if(!k || k.includes('REPLACE_WITH')) { console.error('Pega la clave pública en plugins.updater.pubkey'); process.exit(1); }"

      - name: Tag and Sync Version
        id: tag
        shell: bash
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            SYNC_VER="${TAG_NAME#desktop-v}"
            SYNC_VER="${SYNC_VER#v}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
            SYNC_VER="${INPUT_VER:-${TAG_NAME#desktop-v}}"
            SYNC_VER="${SYNC_VER#v}"
          elif [ -n "$INPUT_VER" ]; then
            SYNC_VER="${INPUT_VER#v}"
            TAG_NAME="desktop-v${SYNC_VER}"
          else
            SYNC_VER=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
            TAG_NAME="desktop-v${SYNC_VER}"
          fi
          if [ -n "$SYNC_VER" ] && [[ "$SYNC_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            node -e "
              const fs = require('fs');
              const v = process.argv[1];
              const pkg = JSON.parse(fs.readFileSync('desktop/package.json', 'utf8'));
              pkg.version = v;
              fs.writeFileSync('desktop/package.json', JSON.stringify(pkg, null, 2) + '\n');
              const tauri = JSON.parse(fs.readFileSync('desktop/src-tauri/tauri.conf.json', 'utf8'));
              tauri.version = v;
              fs.writeFileSync('desktop/src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');
              let cargo = fs.readFileSync('desktop/Cargo.toml', 'utf8');
              cargo = cargo.replace(/^version = \"[^\"]+\"/m, 'version = \"' + v + '\"');
              fs.writeFileSync('desktop/Cargo.toml', cargo);
            " "$SYNC_VER"
          fi
          echo "name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VER="${TAG#desktop-v}"
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const tag = process.argv[1];
            const ver = process.argv[2];
            let body = "";

            if (fs.existsSync("CHANGELOG.md")) {
              const ch = fs.readFileSync("CHANGELOG.md", "utf8");
              const re = new RegExp(`^##\\s+\\[?(?:desktop-v|v)?${ver.replace(/\./g, "\\.")}\\]?[^\\n]*\\n([\\s\\S]*?)(?=^##\\s|$)`, "m");
              const m = ch.match(re);
              if (m && m[1].trim()) body = m[1].trim();
            }

            if (!body) {
              let prev = "";
              try {
                prev = execSync("git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true", { encoding: "utf8" }).trim();
              } catch {}
              const range = prev ? `${prev}..HEAD` : "-n 15 HEAD";
              let log = "";
              try {
                log = execSync(`git log ${range} --pretty=format:"%s"`, { encoding: "utf8" }).trim();
              } catch {}
              const lines = log.split(/\r?\n/).map((s) => s.trim()).filter(Boolean)
                .filter((s) => !/^chore:\s*release/i.test(s));

              const feats = [];
              const perfs = [];
              const fixes = [];
              const others = [];
              for (const msg of lines) {
                const clean = msg.replace(/^[a-z]+(\([^)]+\))?:\s*/i, "");
                if (/^feat/i.test(msg)) feats.push(`- ${clean}`);
                else if (/^perf/i.test(msg)) perfs.push(`- ${clean}`);
                else if (/^fix/i.test(msg)) fixes.push(`- ${clean}`);
                else others.push(`- ${clean}`);
              }
              const sections = [];
              if (feats.length) sections.push("### ✨ Novedades\n" + feats.join("\n"));
              if (perfs.length) sections.push("### ⚡ Rendimiento\n" + perfs.join("\n"));
              if (fixes.length) sections.push("### 🐛 Correcciones\n" + fixes.join("\n"));
              if (others.length) sections.push("### 🔧 Otros cambios\n" + others.join("\n"));
              body = sections.join("\n\n") || "- Mejoras de estabilidad y rendimiento.";
            }

            const footer = "\n\n---\nInstalador de MMT Sync para Windows 10 y 11.\nEl ejecutable no lleva certificado de código: SmartScreen puede mostrar «editor desconocido».";
            const full = body + footer;
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, "body<<__MMT_NOTES_EOF__\n" + full + "\n__MMT_NOTES_EOF__\n");
          ' "$TAG" "$VER"

      - name: Build and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: MMT Sync ${{ steps.tag.outputs.name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi --config src-tauri/tauri.release.json

      - name: Check SignPath configuration
        id: signpath_check
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) -and -not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Stage unsigned Windows installers
        if: steps.signpath_check.outputs.enabled == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signpath-unsigned | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe signpath-unsigned/ -ErrorAction SilentlyContinue
          Copy-Item desktop/src-tauri/target/release/bundle/msi/*.msi signpath-unsigned/ -ErrorAction SilentlyContinue
          Get-ChildItem signpath-unsigned

      - name: Upload unsigned installers artifact
        if: steps.signpath_check.outputs.enabled == 'true'
        id: upload_unsigned
        uses: actions/upload-artifact@v7
        with:
          name: mmt-sync-unsigned
          path: signpath-unsigned/*
          retention-days: 1

      - name: Sign installers with SignPath Foundation
        if: steps.signpath_check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mmt-sync' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 2400
          output-artifact-directory: ./signpath-signed

      # Authenticode cambia los bytes del instalador: hay que volver a generar las firmas
      # del updater de Tauri (.sig) y actualizar latest.json, o las auto-actualizaciones fallarían.
      - name: Re-sign updater signatures and publish signed installers
        if: steps.signpath_check.outputs.enabled == 'true'
        shell: pwsh
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem -Path ../signpath-signed -Include *.exe,*.msi -Recurse)
          if ($files.Count -eq 0) { throw "SignPath no devolvió instaladores firmados." }
          # GitHub publica los assets con puntos en lugar de espacios: mismo nombre para que --clobber los reemplace.
          $files = @($files | ForEach-Object { $n = $_.Name -replace ' ', '.'; if ($n -ne $_.Name) { Rename-Item $_.FullName $n }; Get-Item (Join-Path $_.DirectoryName $n) })
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne "Valid") { throw "Firma Authenticode no válida en $($f.Name): $($sig.Status)" }
            npx tauri signer sign "$($f.FullName)"
            if ($LASTEXITCODE -ne 0) { throw "tauri signer sign falló en $($f.Name)" }
          }
          gh release download $env:TAG -p latest.json -O ../latest.json --clobber
          node -e "const fs=require('fs');const path=require('path');const dir='../signpath-signed';const all=[];(function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);e.isDirectory()?walk(p):all.push(p);}})(dir);const j=JSON.parse(fs.readFileSync('../latest.json','utf8'));const norm=s=>s.replace(/ /g,'.');for(const k of Object.keys(j.platforms||{})){const url=j.platforms[k].url||'';const name=decodeURIComponent(url.split('/').pop());const hit=all.find(p=>p.endsWith('.sig')&&norm(path.basename(p,'.sig'))===name);if(hit){j.platforms[k].signature=fs.readFileSync(hit,'utf8').trim();console.log('updated',k);}else{console.log('no match',k,name);}}j.notes='Instalador de MMT Sync para Windows 10 y 11. Firmado digitalmente mediante SignPath Foundation.';fs.writeFileSync('../latest.json',JSON.stringify(j,null,2));"
          $upload = @($files | ForEach-Object { $_.FullName; "$($_.FullName).sig" }) + (Resolve-Path ../latest.json).Path
          gh release upload $env:TAG @upload --clobber
          gh release edit $env:TAG --latest --notes "Instalador de MMT Sync para Windows 10 y 11.`nFirmado digitalmente: Free code signing provided by SignPath.io, certificate by SignPath Foundation."

      - name: Prune old desktop releases (keep latest 3)
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releases = gh release list --limit 50 --json tagName,createdAt | ConvertFrom-Json | Sort-Object -Property createdAt -Descending
          if ($releases.Count -gt 3) {
            $toDelete = $releases | Select-Object -Skip 3
            foreach ($r in $toDelete) {
              Write-Host "Deleting old release $($r.tagName)..."
              gh release delete $r.tagName --yes --cleanup-tag 2>$null
            }
          }
