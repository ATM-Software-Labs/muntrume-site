name: Refresh iRacing ratings

# GitHub cron is UTC. These two runs land on 07:15 Europe/Madrid all year:
#   05:15 UTC = 07:15 CEST (summer) and 06:15 CET (winter, skipped: before 07:00)
#   06:15 UTC = 08:15 CEST (same Madrid date, no second point) and 07:15 CET (winter)
# The script stamps the point with the Europe/Madrid calendar date. A failed
# fetch does not rewrite src/data/rating-history.json.
on:
  # Schedule paused until iRacing OAuth API credentials (IRACING_CLIENT_ID/SECRET) are issued.
  # schedule:
  #   - cron: "15 5 * * *"
  #   - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          # Optional. Set RATINGS_PUSH_TOKEN only if branch protection blocks the
          # default GITHUB_TOKEN from pushing the daily commit to main.
          token: ${{ secrets.RATINGS_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Fetch today's ratings
        id: refresh
        env:
          IRACING_CLIENT_ID: ${{ secrets.IRACING_CLIENT_ID }}
          IRACING_CLIENT_SECRET: ${{ secrets.IRACING_CLIENT_SECRET }}
          IRACING_USERNAME: ${{ secrets.IRACING_USERNAME }}
          IRACING_PASSWORD: ${{ secrets.IRACING_PASSWORD }}
          MMT_CANBUS_TX: ${{ secrets.MMT_CANBUS_TX }}
          MMT_CANBUS_RX: ${{ secrets.MMT_CANBUS_RX }}
        run: node scripts/refresh-ratings.mjs ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Install dependencies
        if: steps.refresh.outputs.changed == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.refresh.outputs.changed == 'true'
        run: npm run check

      - name: Commit the new points
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/rating-history.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: append daily iRacing ratings"
          git push origin HEAD:main

      - name: Build site
        if: steps.refresh.outputs.changed == 'true'
        run: npm run build

      - name: Confirm GitHub Pages output excludes the desktop app
        if: steps.refresh.outputs.changed == 'true'
        run: |
          test ! -e _site/desktop
          test ! -e _site/src-tauri

      - name: Upload artifact
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.refresh.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
